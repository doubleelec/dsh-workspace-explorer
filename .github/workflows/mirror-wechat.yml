name: Mirror to WeChat git

# GitHub 为主力,微信代码平台只做冷备镜像。
# push 到 main 即自动同步过去;微信远端需在 repo secrets 配 WECHAT_MIRROR_KEY(微信 SSH 私钥)。
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wechat-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.WECHAT_MIRROR_KEY }}

      - name: Trust wechat host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan git.weixin.qq.com >> ~/.ssh/known_hosts
          # 微信侧 host key 仍是 ssh-rsa，现代 OpenSSH 默认拒收，这里显式放行；
          # 用户密钥若用 ed25519 则不受影响，用 RSA 老钥也一并兼容
          {
            echo "Host git.weixin.qq.com"
            echo "  HostkeyAlgorithms +ssh-rsa"
            echo "  PubkeyAcceptedAlgorithms +ssh-rsa"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Add wechat remote and push
        run: |
          if [ -z "${{ secrets.WECHAT_MIRROR_KEY }}" ]; then
            echo "::error::WECHAT_MIRROR_KEY secret is empty. Add the wechat SSH private key at Settings -> Secrets -> Actions, then Re-run this job."
            exit 1
          fi
          git remote add wechat "git@git.weixin.qq.com:doubleelec/dsh-workspace-explorer.git" 2>/dev/null || \
            git remote set-url wechat "git@git.weixin.qq.com:doubleelec/dsh-workspace-explorer.git"
          git push wechat refs/heads/main:refs/heads/main --tags --force-with-lease
